name: Build Freedoom APK (assembleDebug) and upload artifact

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install OS packages (wget unzip) for sdkmanager
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip tar

      - name: Install Android commandline tools and SDK (platform 36)
        run: |
          set -e
          mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools"
          # download commandline tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/cmdline.zip
          unzip -q /tmp/cmdline.zip -d /tmp/cmdline
          mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools/latest"
          mv /tmp/cmdline/cmdline-tools/* "${ANDROID_SDK_ROOT}/cmdline-tools/latest/"
          # add sdkmanager to PATH for this step
          export PATH="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${ANDROID_SDK_ROOT}/platform-tools:${PATH}"
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${ANDROID_SDK_ROOT}" --licenses || true
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${ANDROID_SDK_ROOT}" "platform-tools" "platforms;android-36" "build-tools;33.0.2"

      - name: Print debug info (Java/SDK)
        run: |
          java -version || true
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "${ANDROID_SDK_ROOT}"
          which sdkmanager || true
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --version || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties','**/gradle-wrapper.properties') }}-${{ hashFiles('**/*.gradle*','**/*.gradle.kts') }}

      - name: Build APK (assembleDebug)
        env:
          PATH: ${{ github.workspace }}/android-sdk/platform-tools:${PATH}
        run: ./gradlew :doom:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Freedoom-android-apk
          path: doom/build/outputs/apk/debug/*.apk
