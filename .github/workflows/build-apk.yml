name: Build Freedoom APK (assembleDebug) and upload artifact

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Ensure gradlew is executable
        run: |
          ls -la
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi
          echo "gradlew ready: $( [ -x ./gradlew ] && echo yes || echo no )"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install OS packages needed
        run: sudo apt-get update && sudo apt-get install -y wget unzip zip

      - name: Download & install Android commandline tools (robust)
        run: |
          set -euo pipefail
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          mkdir -p "${ANDROID_SDK_ROOT}"
          TMPDIR=$(mktemp -d)
          echo "tmpdir=$TMPDIR"
          cd "$TMPDIR"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline.zip
          unzip -q cmdline.zip
          # The zip can produce a top-level "cmdline-tools" directory.
          # Place it under $ANDROID_SDK_ROOT/cmdline-tools/latest
          mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools"
          if [ -d "./cmdline-tools" ]; then
            mv ./cmdline-tools "${ANDROID_SDK_ROOT}/cmdline-tools/latest"
          else
            # fallback: move all into latest
            mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools/latest"
            mv ./* "${ANDROID_SDK_ROOT}/cmdline-tools/latest/" || true
          fi
          chmod -R a+rx "${ANDROID_SDK_ROOT}/cmdline-tools"
          ls -la "${ANDROID_SDK_ROOT}/cmdline-tools" || true
          # add sdkmanager to PATH for this shell
          export PATH="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${PATH}"
          # accept licenses and install platform/tools
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${ANDROID_SDK_ROOT}" --licenses || true
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${ANDROID_SDK_ROOT}" "platform-tools" "platforms;android-36" "build-tools;33.0.2"

      - name: Debug: show SDK files and tools
        run: |
